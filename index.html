<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="description" content="Phasor / complex calculator for circuit analysis with live phasor diagram. 电工相量计算器，实时绘制相量图。" />
    <title>相量计算器 · Phasor Lab</title>
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">∠</span>
          <div class="brand-text">
            <h1 id="app-title">相量计算器</h1>
            <p id="app-subtitle"></p>
          </div>
        </div>
        <nav class="topbar-controls" id="topbar-controls" aria-label="settings"></nav>
      </header>

      <main class="workspace" id="workspace">
        <section class="pane pane-algebra" aria-labelledby="algebra-title">
          <div class="pane-header">
            <h2 id="algebra-title">代数区</h2>
            <select class="control-select examples" id="examples" aria-label="examples"></select>
            <div class="pane-actions">
              <button type="button" class="btn ghost" id="btn-undo" disabled>↶</button>
              <button type="button" class="btn ghost" id="btn-redo" disabled>↷</button>
              <button type="button" class="btn ghost" id="btn-export">⬇</button>
              <button type="button" class="btn ghost" id="btn-import">⬆</button>
              <button type="button" class="btn ghost" id="btn-help">?</button>
              <button type="button" class="btn ghost" id="btn-about">ⓘ</button>
              <button type="button" class="btn ghost" id="btn-settings">⚙</button>
              <button type="button" class="btn ghost" id="btn-clear">清空</button>
            </div>
          </div>
          <input type="file" id="file-input" accept=".json,application/json" hidden />
          <input type="file" id="csv-input" accept=".csv,text/csv" hidden />

          <!-- Phone layout: the algebra pane becomes three swipeable tabs. On a
               wide screen the tab bar is hidden and `.tab-view` / `.tab-panel`
               are `display: contents`, so the markup below behaves exactly like
               the flat layout it replaced. -->
          <nav class="tab-bar" id="tab-bar" role="tablist">
            <button type="button" class="tab" role="tab" data-tab="input" aria-selected="true">输入</button>
            <button type="button" class="tab" role="tab" data-tab="formula" aria-selected="false">公式</button>
            <button type="button" class="tab" role="tab" data-tab="result" aria-selected="false">结果</button>
          </nav>

          <div class="tab-view" id="tab-view">
            <section class="tab-panel" data-tab="input" data-active>
              <div class="input-area">
                <math-field id="input" class="math-input" aria-label="phasor input"></math-field>
                <div class="keyboard" id="keyboard"></div>
                <p class="keyboard-hint" id="keyboard-hint"></p>
                <p class="input-error" id="input-error" hidden></p>
              </div>
            </section>

            <div class="pane-body" id="pane-body">
              <section class="tab-panel" data-tab="formula">
                <div class="object-list" id="object-list"></div>
              </section>

              <section class="tab-panel" data-tab="result">
                <div class="result-card" id="result-card"></div>
                <div class="result-card" id="compare-card"></div>
                <div class="result-card equation-card" id="equation-card">
                  <h3 id="equation-title">方程</h3>
                  <div class="equation-row">
                    <math-field id="equation-input" class="math-input" aria-label="equation"></math-field>
                    <button type="button" class="btn primary" id="btn-solve">求解</button>
                  </div>
                  <p class="card-hint" id="equation-hint"></p>
                  <div class="equation-result" id="equation-result"></div>
                </div>
              </section>
            </div>
          </div>
        </section>

        <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>

        <section class="pane pane-graphics" aria-labelledby="graphics-title">
          <div class="pane-header">
            <h2 id="graphics-title">图形区</h2>
            <div class="pane-actions graphics-tools" id="graphics-tools"></div>
          </div>
          <div class="canvas-wrap">
            <canvas id="canvas"></canvas>
          </div>
          <p class="status" id="status"></p>
        </section>
      </main>

      <dialog class="help-dialog" id="help-dialog">
        <h2 id="help-title">语法速查</h2>
        <ul id="help-list"></ul>
        <form method="dialog"><button class="btn primary" id="help-close">关闭</button></form>
      </dialog>

      <dialog class="help-dialog about-dialog" id="about-dialog">
        <h2 id="about-title">关于</h2>
        <div id="about-body"></div>
        <form method="dialog"><button class="btn primary" id="about-close">关闭</button></form>
      </dialog>

      <dialog class="help-dialog settings-dialog" id="settings-dialog">
        <h2 id="settings-title">设置</h2>
        <div class="dialog-body">
          <section class="settings-section">
            <h3 id="settings-shortcuts">快捷键</h3>
            <p class="card-hint" id="settings-shortcuts-hint"></p>
            <div class="shortcut-table" id="shortcut-table"></div>
            <div class="settings-buttons">
              <button type="button" class="btn" id="shortcuts-reset">全部恢复默认</button>
            </div>
          </section>

          <section class="settings-section">
            <h3 id="settings-io">导入导出</h3>

            <div class="settings-block">
              <div class="settings-block-title" id="settings-scope-title">导出范围</div>
              <label class="settings-radio">
                <input type="radio" name="export-scope" value="all" checked />
                <span id="settings-scope-all"></span>
              </label>
              <label class="settings-radio">
                <input type="radio" name="export-scope" value="selected" />
                <span id="settings-scope-selected"></span>
              </label>
              <p class="card-hint" id="settings-summary"></p>
            </div>

            <div class="settings-block">
              <div class="settings-block-title" id="settings-project"></div>
              <div class="settings-buttons">
                <button type="button" class="btn" id="settings-export-project"></button>
                <button type="button" class="btn" id="settings-import-project"></button>
              </div>
              <p class="card-hint" id="settings-project-hint"></p>
            </div>

            <div class="settings-block">
              <div class="settings-block-title" id="settings-csv"></div>
              <div class="settings-buttons">
                <button type="button" class="btn" id="settings-export-csv"></button>
                <button type="button" class="btn" id="settings-import-csv"></button>
              </div>
              <p class="card-hint" id="settings-csv-hint"></p>
            </div>

            <div class="settings-block">
              <div class="settings-block-title" id="settings-image"></div>
              <div class="settings-buttons">
                <label class="settings-field">
                  <span id="settings-scale"></span>
                  <select id="settings-scale-select">
                    <option value="1">1×</option>
                    <option value="2">2×</option>
                    <option value="3">3×</option>
                    <option value="4">4×</option>
                  </select>
                </label>
                <label class="settings-check">
                  <input type="checkbox" id="settings-transparent" />
                  <span id="settings-transparent-label"></span>
                </label>
              </div>
              <div class="settings-buttons">
                <button type="button" class="btn" id="settings-export-png"></button>
                <button type="button" class="btn" id="settings-export-svg"></button>
              </div>
              <p class="card-hint" id="settings-image-hint"></p>
            </div>
          </section>
        </div>
        <form method="dialog"><button class="btn primary" id="settings-close">关闭</button></form>
      </dialog>

      <div class="drop-overlay" id="drop-overlay" hidden>
        <div class="drop-card">
          <div class="drop-title" id="drop-title"></div>
          <div class="drop-hint" id="drop-hint"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
